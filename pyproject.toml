[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quat-sitl"
version = "0.1.0"
description = "Quaternion-based quadrotor attitude control SITL, reproducing Fresk & Nikolakopoulos ECC 2013"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[tool.setuptools.packages.find]
include = ["quat_sitl*"]
