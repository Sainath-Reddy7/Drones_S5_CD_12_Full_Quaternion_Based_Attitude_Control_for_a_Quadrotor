<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quaternion Quadrotor Attitude Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d;
    display: flex; align-items: baseline; gap: 10px;
  }
  header .title { font-size: 14px; font-weight: 700; }
  header .subtitle { color: #8b949e; font-size: 11px; }
  #main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  #view3d { flex: 1; position: relative; min-width: 0; }
  #canvas3d { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #canvas3d:active { cursor: grabbing; }
  #hud {
    position: absolute; top: 10px; left: 12px; pointer-events: none;
    font-family: "SF Mono", "Fira Code", Monaco, monospace; font-size: 11px;
    color: #8b949e; line-height: 1.7; text-shadow: 0 0 4px #0d1117;
  }
  #hud .v { color: #d2a8ff; }
  #hud .lbl { color: #6e7681; }
  #hint {
    position: absolute; bottom: 8px; left: 12px; pointer-events: none;
    font-size: 10px; color: #484f58;
  }
  #plots {
    width: 400px; min-width: 400px; border-left: 1px solid #30363d;
    display: flex; flex-direction: column;
  }
  .pnl { flex: 1; min-height: 0; position: relative; border-bottom: 1px solid #21262d; }
  .pnl canvas { width: 100%; height: calc(100% - 18px); display: block; }
  .pnl-hdr {
    font-size: 10px; color: #8b949e; padding: 4px 10px 0;
    display: flex; gap: 12px; align-items: center;
  }
  .lg { display: inline-flex; align-items: center; gap: 3px; }
  .lg span { width: 14px; height: 0; border-top: 2px solid; }
  .lg.d span { border-top-style: dashed; }
  #controls {
    padding: 8px 16px; background: #161b22; border-top: 1px solid #30363d;
    display: flex; align-items: center; gap: 14px;
  }
  .btn-group { display: flex; gap: 3px; }
  .btn {
    padding: 5px 14px; background: #21262d; color: #c9d1d9;
    border: 1px solid #30363d; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 500; transition: all 0.12s; user-select: none;
  }
  .btn:hover { background: #30363d; border-color: #8b949e; }
  .btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #play-btn { min-width: 76px; text-align: center; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 4px;
    background: #21262d; border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #58a6ff; border-radius: 50%; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; background: #58a6ff;
    border: none; border-radius: 50%; cursor: pointer;
  }
  select {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  .t-disp { font-family: "SF Mono", Monaco, monospace; font-size: 12px;
            color: #58a6ff; min-width: 64px; text-align: right; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">Full Quaternion-Based Attitude Control</span>
    <span class="subtitle">Fresk &amp; Nikolakopoulos (ECC 2013) — P&#x00B2; controller, eq. (17)&ndash;(21) · SITL reproduction</span>
  </header>
  <div id="main">
    <div id="view3d">
      <canvas id="c3d"></canvas>
      <div id="hud"></div>
      <div id="hint">drag to orbit · scroll to zoom</div>
    </div>
    <div id="plots">
      <div class="pnl">
        <div class="pnl-hdr">
          <span>Attitude tracking [rad]</span>
          <span class="lg"><span style="border-color:#58a6ff"></span>&phi;</span>
          <span class="lg"><span style="border-color:#f0883e"></span>&theta;</span>
          <span class="lg"><span style="border-color:#bc8cff"></span>&psi;</span>
          <span class="lg d"><span style="border-color:#6e7681"></span>ref</span>
        </div>
        <canvas id="c-ang"></canvas>
      </div>
      <div class="pnl">
        <div class="pnl-hdr">
          <span>Control effort [N&middot;m] &mdash; bounds &plusmn;4</span>
        </div>
        <canvas id="c-tau"></canvas>
      </div>
    </div>
  </div>
  <div id="controls">
    <div class="btn-group">
      <button class="btn active" data-sc="step">Step</button>
      <button class="btn" data-sc="sine">Sine</button>
      <button class="btn" data-sc="flip">Flip 360&deg;</button>
    </div>
    <button class="btn" id="play-btn">&#9208; Pause</button>
    <select id="speed">
      <option value="0.25">0.25&times;</option>
      <option value="0.5">0.5&times;</option>
      <option value="1" selected>1&times;</option>
      <option value="2">2&times;</option>
      <option value="4">4&times;</option>
    </select>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span class="t-disp" id="tdisp">0.00s</span>
  </div>
</div>

<script>
"use strict";
/* === Simulation trajectory data (injected by build_ui.py) ================== */
const RAW = __SIM_DATA__;

/* === Vector / quaternion math ============================================= */
function dot3(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross3(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vsub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vnorm(v){const n=Math.hypot(v[0],v[1],v[2]);return n<1e-12?[0,0,0]:[v[0]/n,v[1]/n,v[2]/n];}

/* Quaternion -> DCM, paper eq. (9)-(12).  R @ v_body = v_world (point rot). */
function q2R(q){
  const q0=q[0],q1=q[1],q2=q[2],q3=q[3];
  return [
    [q0*q0+q1*q1-q2*q2-q3*q3, 2*(q1*q2-q0*q3),        2*(q1*q3+q0*q2)],
    [2*(q1*q2+q0*q3),          q0*q0-q1*q1+q2*q2-q3*q3, 2*(q2*q3-q0*q1)],
    [2*(q1*q3-q0*q2),          2*(q2*q3+q0*q1),         q0*q0-q1*q1-q2*q2+q3*q3]
  ];
}
function Rv(R,v){
  return [R[0][0]*v[0]+R[0][1]*v[1]+R[0][2]*v[2],
          R[1][0]*v[0]+R[1][1]*v[1]+R[1][2]*v[2],
          R[2][0]*v[0]+R[2][1]*v[1]+R[2][2]*v[2]];
}

/* === Pre-process raw data into per-series arrays =========================== */
function prep(d){
  return {
    dur:d.duration, t:d.times, q:d.q,
    phi:  d.euler.map(e=>e[0]),     theta: d.euler.map(e=>e[1]),     psi:  d.euler.map(e=>e[2]),
    phir: d.eref.map(e=>e[0]),      thetar:d.eref.map(e=>e[1]),      psir: d.eref.map(e=>e[2]),
    tx:   d.tau.map(e=>e[0]),       ty:   d.tau.map(e=>e[1]),        tz:   d.tau.map(e=>e[2]),
  };
}
const D={step:prep(RAW.step),sine:prep(RAW.sine),flip:prep(RAW.flip)};

/* === State ================================================================= */
let sc="step", tCur=0, playing=true, speed=1.0, lastTS=0, spin=0;
let yaw=-0.6, pitch=0.38, dist=0.95;

/* === Canvas setup (HiDPI) ================================================== */
const dpr=window.devicePixelRatio||1;
function setupCanvas(id){
  const c=document.getElementById(id);
  function resize(){
    const r=c.getBoundingClientRect();
    c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  }
  resize();
  return {c,ctx:c.getContext("2d"),resize};
}
const V3=setupCanvas("c3d"),  VA=setupCanvas("c-ang"), VT=setupCanvas("c-tau");
window.addEventListener("resize",()=>{V3.resize();VA.resize();VT.resize();});

/* === 3D camera / projection ================================================ */
function camPos(){return[dist*Math.cos(pitch)*Math.sin(yaw),
                          dist*Math.cos(pitch)*Math.cos(yaw),
                          dist*Math.sin(pitch)];}
function camBasis(){
  const cp=camPos();
  const f=vnorm(vsub([0,0,0],cp));
  const r=vnorm(cross3(f,[0,0,1]));
  const u=cross3(r,f);
  return{cp,f,r,u};
}
function proj(p,cam,w,h){
  const rel=vsub(p,cam.cp);
  const cr=dot3(cam.r,rel), cu=dot3(cam.u,rel), cf=dot3(cam.f,rel);
  if(cf<0.01)return null;
  const f=Math.min(w,h)*0.85;
  return[w/2+f*cr/cf, h/2-f*cu/cf, cf];
}
function line3(ctx,p1,p2,cam,w,h,col,lw,dash){
  const s1=proj(p1,cam,w,h), s2=proj(p2,cam,w,h);
  if(!s1||!s2)return;
  const ad=(s1[2]+s2[2])/2;
  const ds=Math.max(0.35,Math.min(2.5,0.75/ad));
  ctx.strokeStyle=col; ctx.lineWidth=lw*ds;
  ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(s1[0],s1[1]); ctx.lineTo(s2[0],s2[1]); ctx.stroke();
  ctx.setLineDash([]);
}
function label3(ctx,p,cam,w,h,text,col,bold){
  const s=proj(p,cam,w,h);if(!s)return;
  ctx.fillStyle=col;ctx.font=(bold?"bold ":"")+(12*dpr)+"px sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,s[0],s[1]);
}

/* === Quadrotor geometry (body frame) ======================================= */
const ARM=0.15, RR=0.058, AL=0.22;
const TIPS=[[ARM,ARM,0],[-ARM,-ARM,0],[ARM,-ARM,0],[-ARM,ARM,0]];

function drawGrid(ctx,cam,w,h){
  const S=0.32,step=0.08,z=-0.09;
  ctx.lineWidth=0.5*dpr;
  for(let i=-S;i<=S+1e-9;i+=step){
    let a=proj([-S,i,z],cam,w,h),b=proj([S,i,z],cam,w,h);
    if(a&&b){ctx.strokeStyle="rgba(40,46,55,0.7)";ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    a=proj([i,-S,z],cam,w,h),b=proj([i,S,z],cam,w,h);
    if(a&&b){ctx.strokeStyle="rgba(40,46,55,0.7)";ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  }
}
function drawWorldAxes(ctx,cam,w,h){
  const L=0.26, o=[0,0,0];
  line3(ctx,o,[L,0,0],cam,w,h,"rgba(255,69,58,0.25)",1.5,[3,3]);
  line3(ctx,o,[0,L,0],cam,w,h,"rgba(50,215,75,0.25)",1.5,[3,3]);
  line3(ctx,o,[0,0,L],cam,w,h,"rgba(10,132,255,0.25)",1.5,[3,3]);
  label3(ctx,[L*1.14,0,0],cam,w,h,"X","rgba(255,69,58,.45)");
  label3(ctx,[0,L*1.14,0],cam,w,h,"Y","rgba(50,215,75,.45)");
  label3(ctx,[0,0,L*1.14],cam,w,h,"Z","rgba(10,132,255,.45)");
}
function drawRotor(ctx,tipBody,R,cam,w,h,idx){
  const cw=Rv(R,tipBody);
  const N=18;
  ctx.strokeStyle="rgba(120,130,150,0.5)"; ctx.lineWidth=1.2*dpr;
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=2*Math.PI*i/N;
    const bp=[tipBody[0]+RR*Math.cos(a),tipBody[1]+RR*Math.sin(a),tipBody[2]];
    const s=proj(Rv(R,bp),cam,w,h);
    if(!s)continue;
    if(i===0)ctx.moveTo(s[0],s[1]); else ctx.lineTo(s[0],s[1]);
  }
  ctx.stroke();
  /* hub */
  const cs=proj(cw,cam,w,h);
  if(cs){ctx.fillStyle="#30363d";ctx.beginPath();ctx.arc(cs[0],cs[1],3*dpr,0,7);ctx.fill();}
  /* spinning blades */
  const dir=idx<2?1:-1, ba=spin*dir;
  for(let b=0;b<2;b++){
    const a2=ba+b*Math.PI;
    const tip=Rv(R,[tipBody[0]+RR*Math.cos(a2),tipBody[1]+RR*Math.sin(a2),tipBody[2]]);
    line3(ctx,cw,tip,cam,w,h,"rgba(190,200,220,0.55)",1.5);
  }
}
function drawDrone(ctx,R,cam,w,h){
  const tw=TIPS.map(t=>Rv(R,t));
  /* arms — two diagonal pairs */
  line3(ctx,tw[0],tw[1],cam,w,h,"#00d4ff",5.5);
  line3(ctx,tw[2],tw[3],cam,w,h,"#ff9500",5.5);
  /* body axes */
  const o=Rv(R,[0,0,0]);
  line3(ctx,o,Rv(R,[AL,0,0]),cam,w,h,"#ff453a",2.5);
  line3(ctx,o,Rv(R,[0,AL,0]),cam,w,h,"#32d74b",2.5);
  line3(ctx,o,Rv(R,[0,0,AL]),cam,w,h,"#0a84ff",2.5);
  label3(ctx,Rv(R,[AL*1.18,0,0]),cam,w,h,"X","#ff453a",true);
  label3(ctx,Rv(R,[0,AL*1.18,0]),cam,w,h,"Y","#32d74b",true);
  label3(ctx,Rv(R,[0,0,AL*1.18]),cam,w,h,"Z","#0a84ff",true);
  /* rotors */
  for(let i=0;i<4;i++) drawRotor(ctx,TIPS[i],R,cam,w,h,i);
  /* center hub */
  const cs=proj(o,cam,w,h);
  if(cs){ctx.fillStyle="#1f2937";ctx.strokeStyle="#58a6ff";ctx.lineWidth=1.5*dpr;
    ctx.beginPath();ctx.arc(cs[0],cs[1],5*dpr,0,7);ctx.fill();ctx.stroke();}
}

/* === 2D plot helper ======================================================== */
function plot(ctx,cw,ch,times,series,cfg){
  const pL=32*dpr,pR=8*dpr,pT=4*dpr,pB=14*dpr;
  const pw=cw-pL-pR, ph=ch-pT-pB;
  const tMax=times[times.length-1];
  const yMin=cfg.yMin,yMax=cfg.yMax;
  const X=t=>pL+(t/tMax)*pw;
  const Y=v=>pT+ph-((v-yMin)/(yMax-yMin))*ph;
  /* grid + zero */
  ctx.lineWidth=0.5*dpr; ctx.font=(9*dpr)+"px monospace";
  for(let v=Math.ceil(yMin/cfg.step)*cfg.step;v<=yMax;v+=cfg.step){
    ctx.strokeStyle=v===0?"#30363d":"rgba(33,38,45,0.8)";
    ctx.beginPath();ctx.moveTo(pL,Y(v));ctx.lineTo(cw-pR,Y(v));ctx.stroke();
    if(v!==0&&v%cfg.labelStep===0){
      ctx.fillStyle="#484f58";ctx.textAlign="right";
      ctx.fillText(v.toFixed(0),pL-3*dpr,Y(v)+3*dpr);
    }
  }
  /* bounds (saturation) */
  if(cfg.bounds){
    ctx.strokeStyle="rgba(218,54,51,0.5)";ctx.setLineDash([4*dpr,3*dpr]);ctx.lineWidth=1*dpr;
    for(const b of cfg.bounds){ctx.beginPath();ctx.moveTo(pL,Y(b));ctx.lineTo(cw-pR,Y(b));ctx.stroke();}
    ctx.setLineDash([]);
  }
  /* series */
  for(const s of series){
    ctx.strokeStyle=s.c;ctx.lineWidth=1.5*dpr;
    ctx.setLineDash(s.dsh?[4*dpr,3*dpr]:[]);
    ctx.beginPath();
    for(let i=0;i<s.d.length;i++){
      const px=X(times[i]),py=Y(s.d[i]);
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();ctx.setLineDash([]);
  }
  /* time cursor */
  const ct=times[Math.min(times.length-1,Math.max(0,Math.round((tCur/cfg.dur)*(times.length-1))))];
  ctx.strokeStyle="rgba(88,166,255,0.7)";ctx.lineWidth=1*dpr;
  ctx.beginPath();ctx.moveTo(X(ct),pT);ctx.lineTo(X(ct),pT+ph);ctx.stroke();
}

/* === Get current interpolated quaternion =================================== */
function curQ(d){
  const n=d.q.length;
  const ei=(tCur/d.dur)*(n-1);
  const i0=Math.max(0,Math.min(n-1,Math.floor(ei)));
  const i1=Math.min(n-1,i0+1);
  const f=Math.max(0,Math.min(1,ei-i0));
  let q0=d.q[i0],q1=d.q[i1];
  if(q0[0]*q1[0]+q0[1]*q1[1]+q0[2]*q1[2]+q0[3]*q1[3]<0)q1=[-q1[0],-q1[1],-q1[2],-q1[3]];
  const q=[q0[0]+(q1[0]-q0[0])*f,q0[1]+(q1[1]-q0[1])*f,q0[2]+(q1[2]-q0[2])*f,q0[3]+(q1[3]-q0[3])*f];
  const m=Math.hypot(q[0],q[1],q[2],q[3]);
  return m<1e-12?[1,0,0,0]:[q[0]/m,q[1]/m,q[2]/m,q[3]/m];
}

/* === Render functions ====================================================== */
function render3D(){
  const ctx=V3.ctx,cw=V3.c.width,ch=V3.c.height;
  ctx.fillStyle="#0d1117";ctx.fillRect(0,0,cw,ch);
  const d=D[sc],q=curQ(d),R=q2R(q),cam=camBasis();
  drawGrid(ctx,cam,cw,ch);
  drawWorldAxes(ctx,cam,cw,ch);
  drawDrone(ctx,R,cam,cw,ch);
  /* HUD */
  const eu=d.phi,euT=d.theta,euP=d.psi;
  const fi=Math.min(d.t.length-1,Math.max(0,Math.round((tCur/d.dur)*(d.t.length-1))));
  const hud=document.getElementById("hud");
  hud.innerHTML=
    '<span class="lbl">scenario</span> <span class="v">'+sc.toUpperCase()+'</span><br>'+
    '<span class="lbl">t</span> = <span class="v">'+tCur.toFixed(2)+'s</span> / '+d.dur.toFixed(0)+'s<br>'+
    '<span class="lbl">q</span> = [<span class="v">'+q.map(v=>v.toFixed(3)).join(", ")+'</span>]<br>'+
    '<span class="lbl">&phi;</span> = <span style="color:#58a6ff">'+d.phi[fi].toFixed(3)+'</span>'+
    ' <span class="lbl">&theta;</span> = <span style="color:#f0883e">'+d.theta[fi].toFixed(3)+'</span>'+
    ' <span class="lbl">&psi;</span> = <span style="color:#bc8cff">'+d.psi[fi].toFixed(3)+'</span>';
}
function renderAngles(){
  const ctx=VA.ctx,cw=VA.c.width,ch=VA.c.height;
  ctx.clearRect(0,0,cw,ch);
  const d=D[sc];
  const subH=ch/3,labels=["\u03c6 (roll)","\u03b8 (pitch)","\u03c8 (yaw)"];
  const outs=[d.phi,d.theta,d.psi],refs=[d.phir,d.thetar,d.psir];
  const cols=["#58a6ff","#f0883e","#bc8cff"];
  const yR=sc==="flip"?{yMin:-4,yMax:7,step:2,labelStep:2}:{yMin:-1.5,yMax:1.5,step:0.5,labelStep:1};
  for(let i=0;i<3;i++){
    ctx.save();ctx.translate(0,i*subH);
    plot(ctx,cw,subH,d.t,[{d:refs[i],c:cols[i]+"70",dsh:true},{d:outs[i],c:cols[i]}],
        Object.assign({dur:d.dur},yR));
    ctx.restore();
    ctx.fillStyle=cols[i];ctx.font="bold 10px sans-serif";ctx.textAlign="left";
    ctx.fillText(labels[i],36*dpr,(i*subH)+12*dpr);
  }
}
function renderTorques(){
  const ctx=VT.ctx,cw=VT.c.width,ch=VT.c.height;
  ctx.clearRect(0,0,cw,ch);
  const d=D[sc];
  const subH=ch/3,labels=["Mx","My","Mz"];
  const ts=[d.tx,d.ty,d.tz],cols=["#58a6ff","#f0883e","#bc8cff"];
  for(let i=0;i<3;i++){
    ctx.save();ctx.translate(0,i*subH);
    plot(ctx,cw,subH,d.t,[{d:ts[i],c:cols[i]}],
        {yMin:-5,yMax:5,step:2,labelStep:4,bounds:[-4,4],dur:d.dur});
    ctx.restore();
    ctx.fillStyle=cols[i];ctx.font="bold 10px sans-serif";ctx.textAlign="left";
    ctx.fillText(labels[i],36*dpr,(i*subH)+12*dpr);
  }
}

/* === Animation loop ======================================================== */
function loop(ts){
  if(!lastTS)lastTS=ts;
  const dt=(ts-lastTS)/1000;lastTS=ts;
  if(playing){
    tCur+=dt*speed;
    if(tCur>=D[sc].dur)tCur=0;
  }
  spin+=dt*40;
  render3D();renderAngles();renderTorques();
  document.getElementById("scrub").value=Math.round((tCur/D[sc].dur)*1000);
  document.getElementById("tdisp").textContent=tCur.toFixed(2)+"s";
  requestAnimationFrame(loop);
}

/* === UI events ============================================================= */
document.querySelectorAll("[data-sc]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("[data-sc]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");sc=b.dataset.sc;tCur=0;
  });
});
const playBtn=document.getElementById("play-btn");
playBtn.addEventListener("click",()=>{
  playing=!playing;
  playBtn.innerHTML=playing?"\u23F8 Pause":"\u25B6 Play";
});
document.getElementById("speed").addEventListener("change",e=>{speed=parseFloat(e.target.value);});
document.getElementById("scrub").addEventListener("input",e=>{
  tCur=(parseInt(e.target.value)/1000)*D[sc].dur;
});
/* mouse orbit / zoom */
const cv=V3.c;let dragging=false,lx=0,ly=0;
cv.addEventListener("pointerdown",e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{
  if(!dragging)return;
  yaw-=(e.clientX-lx)*0.008;
  pitch=Math.max(-0.05,Math.min(1.4,pitch+(e.clientY-ly)*0.008));
  lx=e.clientX;ly=e.clientY;
});
cv.addEventListener("pointerup",()=>{dragging=false;});
cv.addEventListener("pointercancel",()=>{dragging=false;});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  dist*=e.deltaY>0?1.1:0.9;
  dist=Math.max(0.35,Math.min(4,dist));
},{passive:false});

requestAnimationFrame(loop);
</script>
</body>
